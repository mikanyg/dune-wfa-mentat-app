name: Build, test and deploy

# Changes that only touch Claude Code context, docs or Markdown files do not build or deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - "CLAUDE.md"
      - "docs/**"
      - "**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - "CLAUDE.md"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# Runners are pinned to Ubuntu 24.04 so the ubuntu-latest move to Ubuntu 26 cannot break the WebKit
# system dependencies for the E2E tests unannounced; bump deliberately once Playwright supports it.

# Least privilege: read-only by default; only the jobs that comment on pull requests get write access.
permissions:
  contents: read

jobs:
  # Pipeline: test and sonarcloud run in parallel; deploy runs only when both have passed.

  # SonarQube Cloud CI-based analysis with engine test coverage (automatic analysis cannot import coverage).
  # Builds and runs the engine unit tests itself, then waits for the quality gate: a failed gate fails the job.
  sonarcloud:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for accurate new-code detection and blame

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Analyze with coverage
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"mikanyg_dune-wfa-mentat-app" \
            /o:"mikanyg" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="tests/**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="src/Mahdi.App/**" \
            /d:sonar.qualitygate.wait=true
          dotnet build DuneMahdiSolo.slnx --no-incremental --disable-build-servers
          dotnet test tests/Mahdi.Engine.Tests --no-build \
            --collect "XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  test:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Engine unit tests
        run: dotnet test tests/Mahdi.Engine.Tests -c Release

      - name: Build E2E tests and install WebKit
        run: |
          dotnet build tests/Mahdi.App.E2E -c Release
          pwsh tests/Mahdi.App.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps webkit

      # The E2E fixture publishes its own copy of the app with the Test environment (seeded games).
      - name: End-to-end tests (iPad and iPhone landscape)
        run: dotnet test tests/Mahdi.App.E2E -c Release --no-build

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: tests/Mahdi.App.E2E/bin/Release/net10.0/screenshots
          if-no-files-found: ignore

  # Deploys main to production and pull requests to preview environments, only after tests and the
  # SonarQube Cloud quality gate have passed.
  deploy:
    needs: [test, sonarcloud]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # Static Web Apps posts the preview URL on pull requests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish the app
        run: dotnet publish src/Mahdi.App -c Release -o publish

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1 tag
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Remove the pull request preview environment
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1 tag
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
